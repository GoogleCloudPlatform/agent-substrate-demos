name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run repository hygiene checks
        run: ./hack/check-hygiene.sh

      - name: Lint shell scripts with ShellCheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if (( ${#scripts[@]} > 0 )); then
            shellcheck -x "${scripts[@]}"
          fi

      - name: Validate YAML syntax
        run: |
          python3 - << 'EOF'
          import subprocess, sys, yaml

          files = subprocess.check_output(
              ["git", "ls-files", "*.yaml", "*.yml"], text=True
          ).splitlines()
          for path in files:
              with open(path, "r", encoding="utf-8") as fh:
                  list(yaml.safe_load_all(fh))
          print(f"Validated {len(files)} YAML file(s).")
          EOF

  detect-demos:
    name: detect-demos
    runs-on: ubuntu-latest
    outputs:
      demos: ${{ steps.filter.outputs.demos }}
      has_demos: ${{ steps.filter.outputs.has_demos }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect touched demo directories
        id: filter
        run: |
          python3 - << 'EOF'
          import json, os, pathlib, subprocess

          reserved = {".git", ".github", "docs", "hack"}
          all_demos = sorted(
              p.name for p in pathlib.Path(".").iterdir()
              if p.is_dir() and p.name not in reserved
          )

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          base_ref = os.environ.get("GITHUB_BASE_REF", "")
          selected = []

          if event == "pull_request" and base_ref:
              diff = subprocess.check_output(
                  ["git", "diff", "--name-only", f"origin/{base_ref}...HEAD"],
                  text=True,
              ).splitlines()
              touched_top = {line.split("/", 1)[0] for line in diff if "/" in line}
              selected = [d for d in all_demos if d in touched_top]
          else:
              selected = all_demos

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"demos={json.dumps(selected)}\n")
              out.write(f"has_demos={'true' if selected else 'false'}\n")
          print(f"Selected demos: {selected}")
          EOF

  validate-demo:
    name: validate-demo (${{ matrix.demo }})
    needs: [hygiene, detect-demos]
    if: needs.detect-demos.outputs.has_demos == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: ${{ fromJson(needs.detect-demos.outputs.demos) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Go module (if present)
        if: hashFiles(format('{0}/go.mod', matrix.demo)) != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.demo }}/go.mod
          cache-dependency-path: ${{ matrix.demo }}/go.sum

      - name: Run Go vet & tests
        if: hashFiles(format('{0}/go.mod', matrix.demo)) != ''
        working-directory: ${{ matrix.demo }}
        run: |
          go vet ./...
          go test -race ./...

      - name: Set up Python & uv (if pyproject.toml present)
        if: hashFiles(format('{0}/pyproject.toml', matrix.demo)) != ''
        uses: astral-sh/setup-uv@v5

      - name: Run Python tests (if present)
        if: hashFiles(format('{0}/pyproject.toml', matrix.demo)) != ''
        working-directory: ${{ matrix.demo }}
        run: |
          uv sync --frozen
          if find . -maxdepth 3 \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            uv run pytest
          fi

      - name: Set up Node.js (if package.json present)
        if: hashFiles(format('{0}/package.json', matrix.demo)) != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.demo }}/package-lock.json

      - name: Run Node build & tests (if present)
        if: hashFiles(format('{0}/package.json', matrix.demo)) != ''
        working-directory: ${{ matrix.demo }}
        run: |
          npm ci
          npm run build --if-present
          npm test --if-present

      - name: Set up Terraform (if *.tf present)
        if: hashFiles(format('{0}/**/*.tf', matrix.demo)) != ''
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform formatting & modules
        if: hashFiles(format('{0}/**/*.tf', matrix.demo)) != ''
        working-directory: ${{ matrix.demo }}
        run: |
          terraform fmt -check -recursive
          mapfile -t tf_dirs < <(find . -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u)
          for dir in "${tf_dirs[@]}"; do
            echo "==> Validating Terraform module ${dir}"
            terraform -chdir="${dir}" init -backend=false
            terraform -chdir="${dir}" validate
          done
